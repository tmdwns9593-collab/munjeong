<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문정 배정표 11명 (10/20–10/31)</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --t1: #3b82f6;
    --t2: #f97316;
    --t3: #a78bfa;
    --t4: #64748b;
    --normal: #fbbf24;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
    line-height: 1.4;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; font-size: 0.8rem;
  }
  .legend span {
    padding: 2px 8px; border-radius: 999px; font-weight: 600;
  }
  .t1 { background: var(--t1); color: white; }
  .t2 { background: var(--t2); color: white; }
  .t3 { background: var(--t3); color: white; }
  .t4 { background: var(--t4); color: white; }
  .normal { background: var(--normal); color: #1f2937; }
  .day-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .day-header {
    background: #0f172a;
    padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 700;
    border-bottom: 1px solid var(--border);
  }
  .day-header .wd { color: var(--muted); font-weight: 500; }
  .assignments { padding: 8px 0; }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px;
    border-bottom: 1px solid #1e293b;
  }
  .row:last-child { border-bottom: none; }
  .name { font-weight: 600; min-width: 70px; }
  .gen {
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  .t1-summary {
    background: #0f172a;
    padding: 8px 14px;
    font-size: 0.78rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
  .t1-summary strong { color: #93c5fd; }
  @media (min-width: 600px) {
    body { max-width: 480px; margin: 0 auto; }
  }
</style>
</head>
<body>
<h1>문정 배정표</h1>
<div class="sub">11명 · 1티어 균등 · 2026.10.20 – 10.31<br>같은 1티어 하루 1~2명 · 종료 후 48h 쿨</div>

<div class="legend">
  <span class="t1">1티어</span>
  <span class="t2">2티어</span>
  <span class="t3">3티어</span>
  <span class="t4">4티어</span>
  <span class="normal">일반</span>
</div>

<div id="app"></div>

1": [{"사마의": 1, "강유": 1, "마초": 1, "육항": 0, "공손찬": 1, "장녕": 1, "허저": 1}, {"사마의": 1, "강유": 2, "마초": 1, "육항": 1, "공손찬": 1, "장녕": 1, "허저": 1}, {"사마의": 1, "강유": 0, "마초": 2, "육항": 0, "공손찬": 0, "장녕": 1, "허저": 1}, {"사마의": 1, "강유": 1, "마초": 1, "육항": 0, "공손찬": 1, "장녕": 1, "허저": 1}, {"사마의": 1, "강유": 2, "마초": 1, "육항": 1, "공손찬": 1, "장녕": 1, "허저": 1}, {"사마의": 1, "강유": 0, "마초": 2, "육항": 0, "공손찬": 0, "장녕": 1, "허저": 1}, {"사마의": 1, "강유": 1, "마초": 1, "육항": 0, "공손찬": 1, "장녕": 1, "허저": 1}, {"사마의": 2, "강유": 1, "마초": 1, "육항": 1, "공손찬": 1, "장녕": 1, "허저": 1}, {"사마의": 1, "강유": 1, "마초": 2, "육항": 0, "공손찬": 0, "장녕": 1, "허저": 1}, {"사마의": 1, "강유": 1, "마초": 1, "육항": 0, "공손찬": 1, "장녕": 1, "허저": 1}, {"사마의": 2, "강유": 1, "마초": 1, "육항": 1, "공손찬": 1, "장녕": 1, "허저": 1}, {"사마의": 1, "강유": 1, "마초": 2, "육항": 0, "공손찬": 0, "장녕": 1, "허저": 1}], "T1": ["사마의", "강유", "마초", "육항", "공손찬", "장녕", "허저"]};

const T1 = new Set(data.T1);
const T2 = new Set(["동탁", "조조", "손권", "여포", "장료", "악진", "원소", "황보숭"]);
const T3 = new Set(["좌자", "가후", "노숙", "위연", "서서"]);

function genClass(g) {
  if (g === "일반") return "normal";
  if (T1.has(g)) return "t1";
  if (T2.has(g)) return "t2";
  if (T3.has(g)) return "t3";
  return "t4";
}

const app = document.getElementById("app");
data.days.forEach((day, i) => {
  const card = document.createElement("div");
  card.className = "day-card";
  const header = document.createElement("div");
  header.className = "day-header";
  header.innerHTML = `<span>${day}</span><span class="wd">${data.wd[i]}</span>`;
  card.appendChild(header);

  const body = document.createElement("div");
  body.className = "assignments";
  data.people.forEach(p => {
    const g = data.sched[i][p];
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="name">${p}</span><span class="gen ${genClass(g)}">${g}</span>`;
    body.appendChild(row);
  });
  card.appendChild(body);

  const t1 = data.daily_t1[i];
  const parts = data.T1.filter(g => t1[g] > 0).map(g => `${g}${t1[g]>1?t1[g]:''}`);
  const sumDiv = document.createElement("div");
  sumDiv.className = "t1-summary";
  sumDiv.innerHTML = `1티어: <strong>${parts.join(" · ") || "없음"}</strong>`;
  card.appendChild(sumDiv);

  app.appendChild(card);
});
</script>
</body>
</html>
