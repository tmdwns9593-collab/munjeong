<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문정 배정표</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --t1:#3b82f6; --t2:#f97316; --t3:#a78bfa; --normal:#fbbf24; --border:#334155; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; background:var(--bg); color:var(--text); padding:12px; line-height:1.4; max-width:480px; margin:0 auto; }
  h1 { font-size:1.3rem; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:0.85rem; margin-bottom:12px; }

  .nav button { background:#334155; color:white; border:none; width:40px; height:40px; border-radius:8px; font-size:1.2rem; font-weight:bold; cursor:pointer; }
  .nav button:disabled { opacity:0.3; }
  .nav .date { font-weight:700; font-size:1.1rem; text-align:center; }
  .nav .date .wd { color:var(--muted); font-weight:500; font-size:0.9rem; }
  .legend { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; font-size:0.75rem; }
  .legend span { padding:2px 8px; border-radius:999px; font-weight:600; }
  .t1 { background:var(--t1); color:white; } .t2 { background:var(--t2); color:white; } .t3 { background:var(--t3); color:white; } .normal { background:var(--normal); color:#1f2937; }
  .day-card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid #1e293b; }
  .row:last-child { border-bottom:none; }
  .name { font-weight:600; }
  .gen { font-weight:700; padding:3px 10px; border-radius:6px; font-size:0.9rem; }
  .t1-summary { background:#0f172a; padding:10px 14px; font-size:0.8rem; color:var(--muted); border-top:1px solid var(--border); }
  .t1-summary strong { color:#93c5fd; }
</style>
</head>
